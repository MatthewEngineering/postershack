name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "app3/**"
      - "!app3/terraform/**"
      - "!app3/IaC/**"
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  GCP_IMAGE_BASE: us-central1-docker.pkg.dev/postershack/api
  CLOUD_RUN_SERVICE: postershack-api

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app3
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GCP_IMAGE_BASE }}:${{ github.sha }}
            ${{ env.GCP_IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: image
        run: echo "ref=${{ env.GCP_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build-push.outputs.image }}
