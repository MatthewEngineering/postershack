name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "app3/**"
      - "!app3/terraform/**"
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  IMAGE_BASE: us-central1-docker.pkg.dev/postershack/postershack/postershack-api
  CLOUD_RUN_SERVICE: postershack-api

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          project_id: postershack

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app3
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_BASE }}:${{ github.sha }}
