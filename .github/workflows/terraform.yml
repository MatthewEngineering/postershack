name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

defaults:
  run:
    working-directory: app3/terraform

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}


#### ── One-time bootstrap ──────────────────────────────────────────────────────
#
# Create a service account key and add it to GitHub secrets as GCP_CREDENTIALS:
#
#   gcloud iam service-accounts create postershack-ci \
#     --project=postershack \
#     --display-name="CI/CD service account"
#
#   gcloud projects add-iam-policy-binding postershack \
#     --member="serviceAccount:postershack-ci@postershack.iam.gserviceaccount.com" \
#     --role="roles/owner"
#
#   gcloud iam service-accounts keys create key.json \
#     --iam-account=postershack-ci@postershack.iam.gserviceaccount.com
#
#   # Paste the contents of key.json as the GCP_CREDENTIALS GitHub secret,
#   # then delete the local file: rm key.json
#
# After first terraform apply, also set:
#   GCP_AR_IMAGE_BASE  — terraform output ar_image_base
#   HF_TOKEN           — your HuggingFace token
