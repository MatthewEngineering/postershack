name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

defaults:
  run:
    working-directory: app3/terraform

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}


#### ── Bootstrap: first-time GCP setup ────────────────────────────────────────
#
# Workload Identity doesn't exist yet on first apply, so run Terraform locally:
#
#   gcloud auth application-default login
#   cd app3/terraform
#   terraform init
#   terraform apply \
#     -var="project_id=YOUR_PROJECT" \
#     -var="ghcr_pat=YOUR_PAT" \
#     -var="hf_token=YOUR_HF_TOKEN"
#
# Then set these GitHub secrets from the terraform outputs:
#   GCP_PROJECT_ID                — your GCP project ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER — terraform output workload_identity_provider
#   GCP_SA_EMAIL                  — terraform output github_actions_sa_email
#   GCP_AR_PROXY_BASE_URL         — terraform output ar_proxy_base_url
#   GHCR_PAT                      — GitHub PAT with read:packages
#   HF_TOKEN                      — HuggingFace token
