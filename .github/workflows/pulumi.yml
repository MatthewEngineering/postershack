name: Pulumi

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preview, up, or destroy"
        required: true
        default: preview
        type: choice
        options: [preview, up, destroy]

env:
  # State is stored in GCS — no Pulumi Cloud account needed.
  PULUMI_BACKEND_URL: gs://matthewengineeringgcp-postershack-images/pulumi-state

defaults:
  run:
    working-directory: app3/IaC

jobs:
  pulumi:
    name: Pulumi ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app3/IaC/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Pulumi preview
        if: ${{ inputs.action == 'preview' }}
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: app3/IaC
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Pulumi up
        if: ${{ inputs.action == 'up' }}
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: app3/IaC
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

      - name: Pulumi destroy
        if: ${{ inputs.action == 'destroy' }}
        uses: pulumi/actions@v6
        with:
          command: destroy
          stack-name: dev
          work-dir: app3/IaC
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}


#### ── One-time bootstrap ──────────────────────────────────────────────────────
#
# Add these GitHub secrets (Settings → Secrets → Actions):
#
#   GCP_CREDENTIALS          — service account key JSON (same as build-and-deploy)
#   PULUMI_CONFIG_PASSPHRASE — passphrase used to encrypt secret config values
#                              in Pulumi.dev.yaml (choose any string)
#
# Initialize the GCS backend locally once before first CI run:
#
#   cd app3/IaC
#   export PULUMI_BACKEND_URL=gs://matthewengineeringgcp-postershack-images/pulumi-state
#   export PULUMI_CONFIG_PASSPHRASE=<your-passphrase>
#   pulumi stack init dev
#   pulumi config set --secret postershack-app3:hf_token <your-hf-token>
#
# Commit the updated Pulumi.dev.yaml — the hf_token will be encrypted.




